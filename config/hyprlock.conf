# ГЕНЕРАЛЬНЫЕ НАСТРОЙКИ
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

# ФОН (Берем те же обои, что и на рабочем столе, или скриншот с блюром)
background {
    monitor =
    path = ~/.config/karin-shell/assets/lock.jpg   # ПУТЬ К ТВОИМ ОБОЯМ
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2 # 0 - выключить блюр
    blur_size = 2
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# КАРТИНКА С КАРИН (Маленькая аватарка над полем ввода)
image {
    monitor =
    path = ~/.config/karin-shell/assets/avatar.png # Или статичная картинка
    size = 150
    rounding = -1 # Сделать круглой
    border_size = 4
    border_color = rgb(221, 221, 221)
    rotate = 0
    reload_time = -1
    position = 0, 160
    halign = center
    valign = center
}

# ПОЛЕ ВВОДА ПАРОЛЯ
input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(151515)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    fade_on_empty = true
    placeholder_text = <i>password</i>
    hide_input = false
    position = 0, -130
    halign = center
    valign = center
}

# ЧАСЫ
label {
    monitor =
    text = $TIME
    color = rgba(200, 200, 200, 1.0)
    font_size = 64
    font_family = JetBrains Mono Nerd Font
    position = 0, 0
    halign = center
    valign = center
}

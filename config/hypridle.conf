# karin-shell: автоблокировка и сон
#   5:00  экран притухает до 30%
#   5:30  блокировка (hyprlock)
#   6:00  экран выключается (DPMS, яркость не трогаем)
#  15:00  сон
# Любое движение мыши / клавиша — всё возвращается.

general {
    lock_cmd = pidof hyprlock || hyprlock -c ~/.config/karin-shell/hyprlock.conf   # не запускать второй экземпляр
    before_sleep_cmd = loginctl lock-session                                         # блокировка перед сном
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'          # экран сразу включается после сна
}

# Притушить. Яркость сохраняется (-s) только здесь, один раз — и восстанавливается (-r) при активности.
# Никогда не ставим 0: иначе при сбое экран остаётся чёрным, а 0 ещё и запоминается до перезагрузки.
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 30%
    on-resume = brightnessctl -r
}

listener {
    timeout = 330
    on-timeout = loginctl lock-session
}

# Выключить экран средствами Hyprland, а не яркостью
listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 900
    on-timeout = systemctl suspend
}

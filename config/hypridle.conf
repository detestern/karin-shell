general {
    lock_cmd = pidof hyprlock || hyprlock -c ~/.config/karin-shell/hyprlock.conf   # не запускать второй экземпляр
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # экран сразу включается после сна
}

listener {
    timeout = 300                                # 5min.
    on-timeout = brightnessctl -s set 0         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

listener {
    timeout = 330                                 # 5.5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 360                                                    # 6min
    on-timeout = brightnessctl -s set 0               # screen off when timeout has passed
    on-resume = brightnessctl -r          # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 900                                # 15min
    on-timeout = systemctl suspend                # suspend pc
}
